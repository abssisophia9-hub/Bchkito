[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bchkito"
version = "0.1.0"
description = "Tiny Darija AI companion for elderly Moroccans on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bchkito" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "feedparser>=6.0",
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
gpio = ["gpiozero>=2.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
bchkito = "bchkito.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bchkito = ["prompts/**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
